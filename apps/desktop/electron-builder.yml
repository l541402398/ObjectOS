appId: ai.projectos.desktop
productName: ProjectOS
copyright: Copyright © 2026 ProjectOS contributors

directories:
  output: ../../release
  buildResources: resources

asar: true
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
compression: normal

files:
  - out/**/*
  - package.json
  - "!out/**/*.map"
  - "!node_modules/**/*"

extraResources:
  - from: ../runtime/dist/index.mjs
    to: runtime/index.mjs
  - from: resources/tray.png
    to: tray.png
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png

win:
  icon: resources/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: portable
      arch:
        - x64
        - ia32
    - target: nsis
      arch:
        - x64
        - ia32
  artifactName: ProjectOS-${version}-win-${arch}-portable.${ext}

portable:
  artifactName: ProjectOS-${version}-win-${arch}-portable.${ext}
  unpackDirName: ProjectOS-${version}

nsis:
  artifactName: ProjectOS-${version}-win-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ProjectOS


linux:
  icon: resources/icon.png
  executableName: ProjectOS
  category: Development
  maintainer: ProjectOS contributors <l541402398@users.noreply.github.com>
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: ProjectOS-${version}-linux-${arch}.${ext}




