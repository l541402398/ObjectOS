name: Linux build (Ubuntu 22.04)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Package AppImage
        run: pnpm --filter @projectos/desktop exec electron-builder --linux AppImage
      - name: Checksums
        run: sha256sum release/*.AppImage > release/SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectOS-linux-x86_64
          path: |
            release/*.AppImage
            release/SHA256SUMS-linux.txt
